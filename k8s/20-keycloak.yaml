apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: asix-platform
data:
  realm-export.json: |
{{REALM_EXPORT_JSON}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: asix-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      initContainers:
        - name: wait-for-keycloak-db
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              until psql -h postgresql -U keycloak -d keycloak -c 'select 1' >/dev/null 2>&1; do
                echo "waiting for keycloak database to be ready..."
                sleep 3
              done
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          # Production mode (kc.sh start) instead of start-dev.
          # --http-enabled/--hostname-strict=false keep it reachable over plain
          # HTTP on the internal network for now — put a TLS-terminating
          # reverse proxy/ingress in front and set KC_HOSTNAME before exposing
          # this beyond the cluster.
          args: ["start", "--import-realm", "--health-enabled=true", "--http-enabled=true", "--hostname-strict=false"]
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9000
              name: management
          env:
            - name: KEYCLOAK_ADMIN
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: ADMIN_PASSWORD
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://postgresql:5432/keycloak"
            - name: KC_DB_USERNAME
              value: "keycloak"
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: PASSWORD
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: asix-platform
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
