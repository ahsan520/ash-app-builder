apiVersion: v1
kind: ConfigMap
metadata:
  name: asix-db-schema
  namespace: asix-platform
data:
  schema.sql: |
    -- Phase 1 DB Schema — PostgreSQL with RLS (DESIGN DECISION)
    -- Every multi-tenant table includes tenant_id and RLS policy.
    -- DB session context must be set per connection.

    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

    CREATE TABLE IF NOT EXISTS tenants (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        name VARCHAR(255) NOT NULL,
        parent_tenant_id UUID REFERENCES tenants(id) ON DELETE SET NULL,
        status VARCHAR(50) DEFAULT 'active',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    ALTER TABLE tenants ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS tenant_isolation_policy ON tenants;
    CREATE POLICY tenant_isolation_policy ON tenants
        FOR ALL TO PUBLIC
        USING (id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (id = current_setting('app.current_tenant_id')::UUID);

    CREATE TABLE IF NOT EXISTS users (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        tenant_id UUID REFERENCES tenants(id) NOT NULL,
        username VARCHAR(255) NOT NULL UNIQUE,
        email VARCHAR(255) NOT NULL,
        password_hash VARCHAR(255), -- Keycloak manages auth; local only if needed
        role_ids UUID[] DEFAULT '{}',
        mfa_enabled BOOLEAN DEFAULT FALSE,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    ALTER TABLE users ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS users_tenant_isolation ON users;
    CREATE POLICY users_tenant_isolation ON users
        FOR ALL TO PUBLIC
        USING (tenant_id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (tenant_id = current_setting('app.current_tenant_id')::UUID);

    CREATE TABLE IF NOT EXISTS roles (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        tenant_id UUID REFERENCES tenants(id) NOT NULL,
        name VARCHAR(255) NOT NULL,
        permissions TEXT[] DEFAULT '{}', -- format: module:resource:action
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    ALTER TABLE roles ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS roles_tenant_isolation ON roles;
    CREATE POLICY roles_tenant_isolation ON roles
        FOR ALL TO PUBLIC
        USING (tenant_id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (tenant_id = current_setting('app.current_tenant_id')::UUID);

    CREATE TABLE IF NOT EXISTS audit_events (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        tenant_id UUID REFERENCES tenants(id) NOT NULL,
        user_id UUID REFERENCES users(id),
        action VARCHAR(255) NOT NULL, -- e.g., user:create, settings:update
        resource VARCHAR(255),
        result VARCHAR(50) DEFAULT 'success',
        audit_event_id VARCHAR(255),
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    ALTER TABLE audit_events ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS audit_tenant_isolation ON audit_events;
    CREATE POLICY audit_tenant_isolation ON audit_events
        FOR ALL TO PUBLIC
        USING (tenant_id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (tenant_id = current_setting('app.current_tenant_id')::UUID);

    CREATE TABLE IF NOT EXISTS sessions (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        user_id UUID REFERENCES users(id) NOT NULL,
        tenant_id UUID REFERENCES tenants(id) NOT NULL,
        token_ref VARCHAR(255), -- Keycloak token reference
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        expires_at TIMESTAMP,
        revoked_at TIMESTAMP,
        refreshed_at TIMESTAMP
    );

    ALTER TABLE sessions ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS sessions_tenant_isolation ON sessions;
    CREATE POLICY sessions_tenant_isolation ON sessions
        FOR ALL TO PUBLIC
        USING (tenant_id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (tenant_id = current_setting('app.current_tenant_id')::UUID);

    CREATE INDEX IF NOT EXISTS idx_users_tenant_id ON users(tenant_id);
    CREATE INDEX IF NOT EXISTS idx_roles_tenant_id ON roles(tenant_id);
    CREATE INDEX IF NOT EXISTS idx_audit_tenant_id ON audit_events(tenant_id);
    CREATE INDEX IF NOT EXISTS idx_sessions_tenant_id ON sessions(tenant_id);

    -- ASIX identity mappings
    -- Maps external identities (Keycloak) to ASIX local identities.
    -- Never assumes Keycloak sub == ASIX users.id.

    CREATE TABLE IF NOT EXISTS identity_mappings (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),

        -- External identity provider information
        provider VARCHAR(100) NOT NULL DEFAULT 'keycloak',
        subject VARCHAR(255) NOT NULL,

        -- Identity type: human user or service account
        identity_type VARCHAR(50) NOT NULL
            CHECK (identity_type IN ('human', 'service')),

        -- ASIX local identity
        user_id UUID REFERENCES users(id) ON DELETE CASCADE,

        -- Service identity name/reference when identity_type = service
        service_name VARCHAR(255),

        -- Optional default tenant for this identity
        tenant_id UUID REFERENCES tenants(id) ON DELETE CASCADE,

        status VARCHAR(50) NOT NULL DEFAULT 'active',

        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,

        CONSTRAINT identity_mapping_subject_unique
            UNIQUE (provider, subject),

        CONSTRAINT identity_mapping_identity_check
            CHECK (
                (identity_type = 'human' AND user_id IS NOT NULL)
                OR
                (identity_type = 'service' AND service_name IS NOT NULL)
            )
    );

    ALTER TABLE identity_mappings ENABLE ROW LEVEL SECURITY;

    CREATE INDEX IF NOT EXISTS idx_identity_mappings_user_id
        ON identity_mappings(user_id);

    CREATE INDEX IF NOT EXISTS idx_identity_mappings_tenant_id
        ON identity_mappings(tenant_id);

    CREATE INDEX IF NOT EXISTS idx_identity_mappings_subject
        ON identity_mappings(provider, subject);

    -- Service identities can be authorized for multiple tenants.
    CREATE TABLE IF NOT EXISTS service_identity_tenants (
        service_identity_id UUID NOT NULL
            REFERENCES identity_mappings(id) ON DELETE CASCADE,

        tenant_id UUID NOT NULL
            REFERENCES tenants(id) ON DELETE CASCADE,

        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,

        PRIMARY KEY (service_identity_id, tenant_id)
    );

    ALTER TABLE service_identity_tenants ENABLE ROW LEVEL SECURITY;

    CREATE INDEX IF NOT EXISTS idx_service_identity_tenants_tenant
        ON service_identity_tenants(tenant_id);

    -- Service identities can be assigned one or more tenant-scoped roles.
    CREATE TABLE IF NOT EXISTS service_identity_roles (
        service_identity_id UUID NOT NULL
            REFERENCES identity_mappings(id) ON DELETE CASCADE,

        role_id UUID NOT NULL
            REFERENCES roles(id) ON DELETE CASCADE,

        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,

        PRIMARY KEY (service_identity_id, role_id)
    );

    ALTER TABLE service_identity_roles ENABLE ROW LEVEL SECURITY;

    DROP POLICY IF EXISTS service_identity_roles_tenant_isolation ON service_identity_roles;
    CREATE POLICY service_identity_roles_tenant_isolation
    ON service_identity_roles
    FOR ALL
    TO PUBLIC
    USING (
        EXISTS (
            SELECT 1
            FROM roles r
            WHERE r.id = service_identity_roles.role_id
              AND r.tenant_id = current_setting('app.current_tenant_id')::UUID
        )
    )
    WITH CHECK (
        EXISTS (
            SELECT 1
            FROM roles r
            WHERE r.id = service_identity_roles.role_id
              AND r.tenant_id = current_setting('app.current_tenant_id')::UUID
        )
    );

    CREATE INDEX IF NOT EXISTS idx_service_identity_roles_role
        ON service_identity_roles(role_id);

    GRANT SELECT, INSERT, UPDATE, DELETE
    ON service_identity_roles
    TO asix_admin;

    -- Resolve an external identity before tenant context exists.
    -- This is intentionally a narrow SECURITY DEFINER function so the
    -- application role does not need direct RLS-bypassing access to
    -- identity_mappings or tenants.
    CREATE OR REPLACE FUNCTION resolve_external_identity(
        p_provider VARCHAR,
        p_subject VARCHAR
    )
    RETURNS TABLE (
        identity_id UUID,
        identity_type VARCHAR,
        user_id UUID,
        service_name VARCHAR,
        tenant_id UUID,
        tenant_name VARCHAR,
        status VARCHAR
    )
    LANGUAGE SQL
    SECURITY DEFINER
    SET search_path = pg_catalog, public
    AS $$
        SELECT
            im.id,
            im.identity_type,
            im.user_id,
            im.service_name,
            im.tenant_id,
            t.name,
            im.status
        FROM public.identity_mappings im
        LEFT JOIN public.tenants t
            ON t.id = im.tenant_id
        WHERE im.provider = p_provider
          AND im.subject = p_subject
          AND im.status = 'active'
        LIMIT 1;
    $$;

    REVOKE ALL ON FUNCTION resolve_external_identity(VARCHAR, VARCHAR) FROM PUBLIC;

    GRANT EXECUTE ON FUNCTION resolve_external_identity(VARCHAR, VARCHAR)
        TO asix_admin;

    -- ============================================================
    -- Events table — source-agnostic ingestion (Phase: first live source)
    -- Normalized envelope + raw payload, not a syslog-specific table.
    -- ============================================================

    CREATE TABLE IF NOT EXISTS events (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        tenant_id UUID REFERENCES tenants(id) NOT NULL,
        source_type VARCHAR(100) NOT NULL,
        collector_id VARCHAR(255),
        received_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        event_time TIMESTAMP,
        raw TEXT NOT NULL,
        parsed JSONB DEFAULT '{}'::jsonb,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    ALTER TABLE events ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS events_tenant_isolation ON events;
    CREATE POLICY events_tenant_isolation ON events
        FOR ALL TO PUBLIC
        USING (tenant_id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (tenant_id = current_setting('app.current_tenant_id')::UUID);

    CREATE INDEX IF NOT EXISTS idx_events_tenant_id ON events(tenant_id);
    CREATE INDEX IF NOT EXISTS idx_events_event_time ON events(event_time);
    CREATE INDEX IF NOT EXISTS idx_events_source_type ON events(source_type);
    CREATE INDEX IF NOT EXISTS idx_events_parsed_gin ON events USING GIN (parsed);

    GRANT SELECT, INSERT, UPDATE, DELETE ON events TO asix_admin;

    -- ============================================================
    -- Detections: rules and the alerts they raise
    -- ============================================================

    CREATE TABLE IF NOT EXISTS detection_rules (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        tenant_id UUID REFERENCES tenants(id) NOT NULL,
        name VARCHAR(255) NOT NULL,
        description TEXT,
        severity VARCHAR(20) NOT NULL DEFAULT 'medium',
        enabled BOOLEAN NOT NULL DEFAULT true,
        builtin_key VARCHAR(100),
        mitre TEXT[] DEFAULT '{}',
        definition JSONB NOT NULL,
        last_run_at TIMESTAMP,
        last_error TEXT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE (tenant_id, builtin_key)
    );

    ALTER TABLE detection_rules ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS detection_rules_tenant_isolation ON detection_rules;
    CREATE POLICY detection_rules_tenant_isolation ON detection_rules
        FOR ALL TO PUBLIC
        USING (tenant_id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (tenant_id = current_setting('app.current_tenant_id')::UUID);

    CREATE TABLE IF NOT EXISTS alerts (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        tenant_id UUID REFERENCES tenants(id) NOT NULL,
        rule_id UUID REFERENCES detection_rules(id) ON DELETE CASCADE,
        rule_name VARCHAR(255) NOT NULL,
        severity VARCHAR(20) NOT NULL,
        status VARCHAR(20) NOT NULL DEFAULT 'open',
        title TEXT NOT NULL,
        summary TEXT,
        group_key TEXT NOT NULL DEFAULT 'all',
        event_count INTEGER NOT NULL DEFAULT 0,
        first_event_at TIMESTAMP,
        last_event_at TIMESTAMP,
        details JSONB DEFAULT '{}'::jsonb,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    ALTER TABLE alerts ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS alerts_tenant_isolation ON alerts;
    CREATE POLICY alerts_tenant_isolation ON alerts
        FOR ALL TO PUBLIC
        USING (tenant_id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (tenant_id = current_setting('app.current_tenant_id')::UUID);

    CREATE INDEX IF NOT EXISTS idx_alerts_tenant_status ON alerts(tenant_id, status, last_event_at DESC);
    CREATE INDEX IF NOT EXISTS idx_alerts_rule_group ON alerts(rule_id, group_key);

    GRANT SELECT, INSERT, UPDATE, DELETE ON detection_rules TO asix_admin;
    GRANT SELECT, INSERT, UPDATE, DELETE ON alerts TO asix_admin;

    -- ============================================================
    -- Threat intelligence: indicators (IOCs) and the matcher's scan cursor
    -- ============================================================

    CREATE TABLE IF NOT EXISTS threat_indicators (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        tenant_id UUID REFERENCES tenants(id) NOT NULL,
        type VARCHAR(20) NOT NULL,
        value TEXT NOT NULL,
        source VARCHAR(100) NOT NULL DEFAULT 'manual',
        severity VARCHAR(20) NOT NULL DEFAULT 'medium',
        description TEXT,
        enabled BOOLEAN NOT NULL DEFAULT true,
        expires_at TIMESTAMP,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE (tenant_id, type, value)
    );

    ALTER TABLE threat_indicators ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS threat_indicators_tenant_isolation ON threat_indicators;
    CREATE POLICY threat_indicators_tenant_isolation ON threat_indicators
        FOR ALL TO PUBLIC
        USING (tenant_id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (tenant_id = current_setting('app.current_tenant_id')::UUID);

    CREATE INDEX IF NOT EXISTS idx_threat_indicators_tenant_type ON threat_indicators(tenant_id, type);
    CREATE INDEX IF NOT EXISTS idx_threat_indicators_source ON threat_indicators(tenant_id, source);

    CREATE TABLE IF NOT EXISTS ioc_scan_state (
        tenant_id UUID PRIMARY KEY REFERENCES tenants(id),
        last_received_at TIMESTAMP,
        last_event_id UUID,
        last_run_at TIMESTAMP,
        last_error TEXT,
        matched_total BIGINT NOT NULL DEFAULT 0
    );

    -- cursor scans for the matcher: events of a tenant in arrival order
    CREATE INDEX IF NOT EXISTS idx_events_tenant_received ON events(tenant_id, received_at, id);

    GRANT SELECT, INSERT, UPDATE, DELETE ON threat_indicators TO asix_admin;
    GRANT SELECT, INSERT, UPDATE, DELETE ON ioc_scan_state TO asix_admin;

---
apiVersion: batch/v1
kind: Job
metadata:
  name: asix-schema-init
  namespace: asix-platform
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: asix-schema-init
          image: postgres:16-alpine
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_PASSWORD
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export PGPASSWORD="$ADMIN_PASSWORD"
              PSQL="psql -h postgresql -U asix_admin -d asix_platform -v ON_ERROR_STOP=1"

              # schema.sql is fully idempotent (IF NOT EXISTS / DROP+CREATE
              # POLICY throughout) — always apply it rather than gating on
              # whether one specific table exists, which silently stops
              # applying new additions the moment that table is present.
              echo "Applying src/db/schema.sql"
              $PSQL -f /schema/schema.sql
              echo "Schema applied"
          volumeMounts:
            - name: schema-volume
              mountPath: /schema
      volumes:
        - name: schema-volume
          configMap:
            name: asix-db-schema
