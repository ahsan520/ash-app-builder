apiVersion: v1
kind: ConfigMap
metadata:
  name: asix-db-schema
  namespace: asix-platform
data:
  schema.sql: |
    -- Phase 1 DB Schema — PostgreSQL with RLS (DESIGN DECISION)
    -- Every multi-tenant table includes tenant_id and RLS policy.
    -- DB session context must be set per connection.

    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

    CREATE TABLE IF NOT EXISTS tenants (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        name VARCHAR(255) NOT NULL,
        parent_tenant_id UUID REFERENCES tenants(id) ON DELETE SET NULL,
        status VARCHAR(50) DEFAULT 'active',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    ALTER TABLE tenants ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS tenant_isolation_policy ON tenants;
    CREATE POLICY tenant_isolation_policy ON tenants
        FOR ALL TO PUBLIC
        USING (id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (id = current_setting('app.current_tenant_id')::UUID);

    CREATE TABLE IF NOT EXISTS users (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        tenant_id UUID REFERENCES tenants(id) NOT NULL,
        username VARCHAR(255) NOT NULL UNIQUE,
        email VARCHAR(255) NOT NULL,
        password_hash VARCHAR(255), -- Keycloak manages auth; local only if needed
        role_ids UUID[] DEFAULT '{}',
        mfa_enabled BOOLEAN DEFAULT FALSE,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    ALTER TABLE users ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS users_tenant_isolation ON users;
    CREATE POLICY users_tenant_isolation ON users
        FOR ALL TO PUBLIC
        USING (tenant_id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (tenant_id = current_setting('app.current_tenant_id')::UUID);

    CREATE TABLE IF NOT EXISTS roles (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        tenant_id UUID REFERENCES tenants(id) NOT NULL,
        name VARCHAR(255) NOT NULL,
        permissions TEXT[] DEFAULT '{}', -- format: module:resource:action
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    ALTER TABLE roles ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS roles_tenant_isolation ON roles;
    CREATE POLICY roles_tenant_isolation ON roles
        FOR ALL TO PUBLIC
        USING (tenant_id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (tenant_id = current_setting('app.current_tenant_id')::UUID);

    CREATE TABLE IF NOT EXISTS audit_events (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        tenant_id UUID REFERENCES tenants(id) NOT NULL,
        user_id UUID REFERENCES users(id),
        action VARCHAR(255) NOT NULL, -- e.g., user:create, settings:update
        resource VARCHAR(255),
        result VARCHAR(50) DEFAULT 'success',
        audit_event_id VARCHAR(255),
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    ALTER TABLE audit_events ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS audit_tenant_isolation ON audit_events;
    CREATE POLICY audit_tenant_isolation ON audit_events
        FOR ALL TO PUBLIC
        USING (tenant_id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (tenant_id = current_setting('app.current_tenant_id')::UUID);

    CREATE TABLE IF NOT EXISTS sessions (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        user_id UUID REFERENCES users(id) NOT NULL,
        tenant_id UUID REFERENCES tenants(id) NOT NULL,
        token_ref VARCHAR(255), -- Keycloak token reference
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        expires_at TIMESTAMP,
        revoked_at TIMESTAMP,
        refreshed_at TIMESTAMP
    );

    ALTER TABLE sessions ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS sessions_tenant_isolation ON sessions;
    CREATE POLICY sessions_tenant_isolation ON sessions
        FOR ALL TO PUBLIC
        USING (tenant_id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (tenant_id = current_setting('app.current_tenant_id')::UUID);

    CREATE INDEX IF NOT EXISTS idx_users_tenant_id ON users(tenant_id);
    CREATE INDEX IF NOT EXISTS idx_roles_tenant_id ON roles(tenant_id);
    CREATE INDEX IF NOT EXISTS idx_audit_tenant_id ON audit_events(tenant_id);
    CREATE INDEX IF NOT EXISTS idx_sessions_tenant_id ON sessions(tenant_id);

    -- ASIX identity mappings
    -- Maps external identities (Keycloak) to ASIX local identities.
    -- Never assumes Keycloak sub == ASIX users.id.

    CREATE TABLE IF NOT EXISTS identity_mappings (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),

        -- External identity provider information
        provider VARCHAR(100) NOT NULL DEFAULT 'keycloak',
        subject VARCHAR(255) NOT NULL,

        -- Identity type: human user or service account
        identity_type VARCHAR(50) NOT NULL
            CHECK (identity_type IN ('human', 'service')),

        -- ASIX local identity
        user_id UUID REFERENCES users(id) ON DELETE CASCADE,

        -- Service identity name/reference when identity_type = service
        service_name VARCHAR(255),

        -- Optional default tenant for this identity
        tenant_id UUID REFERENCES tenants(id) ON DELETE CASCADE,

        status VARCHAR(50) NOT NULL DEFAULT 'active',

        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,

        CONSTRAINT identity_mapping_subject_unique
            UNIQUE (provider, subject),

        CONSTRAINT identity_mapping_identity_check
            CHECK (
                (identity_type = 'human' AND user_id IS NOT NULL)
                OR
                (identity_type = 'service' AND service_name IS NOT NULL)
            )
    );

    ALTER TABLE identity_mappings ENABLE ROW LEVEL SECURITY;

    CREATE INDEX IF NOT EXISTS idx_identity_mappings_user_id
        ON identity_mappings(user_id);

    CREATE INDEX IF NOT EXISTS idx_identity_mappings_tenant_id
        ON identity_mappings(tenant_id);

    CREATE INDEX IF NOT EXISTS idx_identity_mappings_subject
        ON identity_mappings(provider, subject);

    -- Service identities can be authorized for multiple tenants.
    CREATE TABLE IF NOT EXISTS service_identity_tenants (
        service_identity_id UUID NOT NULL
            REFERENCES identity_mappings(id) ON DELETE CASCADE,

        tenant_id UUID NOT NULL
            REFERENCES tenants(id) ON DELETE CASCADE,

        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,

        PRIMARY KEY (service_identity_id, tenant_id)
    );

    ALTER TABLE service_identity_tenants ENABLE ROW LEVEL SECURITY;

    CREATE INDEX IF NOT EXISTS idx_service_identity_tenants_tenant
        ON service_identity_tenants(tenant_id);

    -- Service identities can be assigned one or more tenant-scoped roles.
    CREATE TABLE IF NOT EXISTS service_identity_roles (
        service_identity_id UUID NOT NULL
            REFERENCES identity_mappings(id) ON DELETE CASCADE,

        role_id UUID NOT NULL
            REFERENCES roles(id) ON DELETE CASCADE,

        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,

        PRIMARY KEY (service_identity_id, role_id)
    );

    ALTER TABLE service_identity_roles ENABLE ROW LEVEL SECURITY;

    DROP POLICY IF EXISTS service_identity_roles_tenant_isolation ON service_identity_roles;
    CREATE POLICY service_identity_roles_tenant_isolation
    ON service_identity_roles
    FOR ALL
    TO PUBLIC
    USING (
        EXISTS (
            SELECT 1
            FROM roles r
            WHERE r.id = service_identity_roles.role_id
              AND r.tenant_id = current_setting('app.current_tenant_id')::UUID
        )
    )
    WITH CHECK (
        EXISTS (
            SELECT 1
            FROM roles r
            WHERE r.id = service_identity_roles.role_id
              AND r.tenant_id = current_setting('app.current_tenant_id')::UUID
        )
    );

    CREATE INDEX IF NOT EXISTS idx_service_identity_roles_role
        ON service_identity_roles(role_id);

    GRANT SELECT, INSERT, UPDATE, DELETE
    ON service_identity_roles
    TO asix_admin;

    -- Resolve an external identity before tenant context exists.
    -- This is intentionally a narrow SECURITY DEFINER function so the
    -- application role does not need direct RLS-bypassing access to
    -- identity_mappings or tenants.
    CREATE OR REPLACE FUNCTION resolve_external_identity(
        p_provider VARCHAR,
        p_subject VARCHAR
    )
    RETURNS TABLE (
        identity_id UUID,
        identity_type VARCHAR,
        user_id UUID,
        service_name VARCHAR,
        tenant_id UUID,
        tenant_name VARCHAR,
        status VARCHAR
    )
    LANGUAGE SQL
    SECURITY DEFINER
    SET search_path = pg_catalog, public
    AS $$
        SELECT
            im.id,
            im.identity_type,
            im.user_id,
            im.service_name,
            im.tenant_id,
            t.name,
            im.status
        FROM public.identity_mappings im
        LEFT JOIN public.tenants t
            ON t.id = im.tenant_id
        WHERE im.provider = p_provider
          AND im.subject = p_subject
          AND im.status = 'active'
        LIMIT 1;
    $$;

    REVOKE ALL ON FUNCTION resolve_external_identity(VARCHAR, VARCHAR) FROM PUBLIC;

    GRANT EXECUTE ON FUNCTION resolve_external_identity(VARCHAR, VARCHAR)
        TO asix_admin;

    -- ============================================================
    -- Events table — source-agnostic ingestion (Phase: first live source)
    -- Normalized envelope + raw payload, not a syslog-specific table.
    -- ============================================================

    CREATE TABLE IF NOT EXISTS events (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        tenant_id UUID REFERENCES tenants(id) NOT NULL,
        source_type VARCHAR(100) NOT NULL,
        collector_id VARCHAR(255),
        received_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        event_time TIMESTAMP,
        raw TEXT NOT NULL,
        parsed JSONB DEFAULT '{}'::jsonb,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    ALTER TABLE events ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS events_tenant_isolation ON events;
    CREATE POLICY events_tenant_isolation ON events
        FOR ALL TO PUBLIC
        USING (tenant_id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (tenant_id = current_setting('app.current_tenant_id')::UUID);

    CREATE INDEX IF NOT EXISTS idx_events_tenant_id ON events(tenant_id);
    CREATE INDEX IF NOT EXISTS idx_events_event_time ON events(event_time);
    CREATE INDEX IF NOT EXISTS idx_events_source_type ON events(source_type);
    CREATE INDEX IF NOT EXISTS idx_events_parsed_gin ON events USING GIN (parsed);

    GRANT SELECT, INSERT, UPDATE, DELETE ON events TO asix_admin;

    -- ============================================================
    -- Detections: rules and the alerts they raise
    -- ============================================================

    CREATE TABLE IF NOT EXISTS detection_rules (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        tenant_id UUID REFERENCES tenants(id) NOT NULL,
        name VARCHAR(255) NOT NULL,
        description TEXT,
        severity VARCHAR(20) NOT NULL DEFAULT 'medium',
        enabled BOOLEAN NOT NULL DEFAULT true,
        builtin_key VARCHAR(100),
        mitre TEXT[] DEFAULT '{}',
        definition JSONB NOT NULL,
        last_run_at TIMESTAMP,
        last_error TEXT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE (tenant_id, builtin_key)
    );

    ALTER TABLE detection_rules ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS detection_rules_tenant_isolation ON detection_rules;
    CREATE POLICY detection_rules_tenant_isolation ON detection_rules
        FOR ALL TO PUBLIC
        USING (tenant_id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (tenant_id = current_setting('app.current_tenant_id')::UUID);

    CREATE TABLE IF NOT EXISTS alerts (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        tenant_id UUID REFERENCES tenants(id) NOT NULL,
        rule_id UUID REFERENCES detection_rules(id) ON DELETE CASCADE,
        rule_name VARCHAR(255) NOT NULL,
        severity VARCHAR(20) NOT NULL,
        status VARCHAR(20) NOT NULL DEFAULT 'open',
        title TEXT NOT NULL,
        summary TEXT,
        group_key TEXT NOT NULL DEFAULT 'all',
        event_count INTEGER NOT NULL DEFAULT 0,
        first_event_at TIMESTAMP,
        last_event_at TIMESTAMP,
        details JSONB DEFAULT '{}'::jsonb,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    ALTER TABLE alerts ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS alerts_tenant_isolation ON alerts;
    CREATE POLICY alerts_tenant_isolation ON alerts
        FOR ALL TO PUBLIC
        USING (tenant_id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (tenant_id = current_setting('app.current_tenant_id')::UUID);

    CREATE INDEX IF NOT EXISTS idx_alerts_tenant_status ON alerts(tenant_id, status, last_event_at DESC);
    CREATE INDEX IF NOT EXISTS idx_alerts_rule_group ON alerts(rule_id, group_key);

    GRANT SELECT, INSERT, UPDATE, DELETE ON detection_rules TO asix_admin;
    GRANT SELECT, INSERT, UPDATE, DELETE ON alerts TO asix_admin;

    -- Custom rules: correlation vs BIOC, plus an alert category (idempotent upgrade)
    ALTER TABLE detection_rules ADD COLUMN IF NOT EXISTS kind VARCHAR(20) NOT NULL DEFAULT 'correlation';
    ALTER TABLE detection_rules ADD COLUMN IF NOT EXISTS category VARCHAR(100);
    CREATE INDEX IF NOT EXISTS idx_detection_rules_kind ON detection_rules(tenant_id, kind);

    -- ============================================================
    -- Threat intelligence: indicators (IOCs) and the matcher's scan cursor
    -- ============================================================

    CREATE TABLE IF NOT EXISTS threat_indicators (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        tenant_id UUID REFERENCES tenants(id) NOT NULL,
        type VARCHAR(20) NOT NULL,
        value TEXT NOT NULL,
        source VARCHAR(100) NOT NULL DEFAULT 'manual',
        severity VARCHAR(20) NOT NULL DEFAULT 'medium',
        description TEXT,
        enabled BOOLEAN NOT NULL DEFAULT true,
        expires_at TIMESTAMP,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE (tenant_id, type, value)
    );

    ALTER TABLE threat_indicators ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS threat_indicators_tenant_isolation ON threat_indicators;
    CREATE POLICY threat_indicators_tenant_isolation ON threat_indicators
        FOR ALL TO PUBLIC
        USING (tenant_id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (tenant_id = current_setting('app.current_tenant_id')::UUID);

    CREATE INDEX IF NOT EXISTS idx_threat_indicators_tenant_type ON threat_indicators(tenant_id, type);
    CREATE INDEX IF NOT EXISTS idx_threat_indicators_source ON threat_indicators(tenant_id, source);

    CREATE TABLE IF NOT EXISTS ioc_scan_state (
        tenant_id UUID PRIMARY KEY REFERENCES tenants(id),
        last_received_at TIMESTAMP,
        last_event_id UUID,
        last_run_at TIMESTAMP,
        last_error TEXT,
        matched_total BIGINT NOT NULL DEFAULT 0
    );

    -- cursor scans for the matcher: events of a tenant in arrival order
    CREATE INDEX IF NOT EXISTS idx_events_tenant_received ON events(tenant_id, received_at, id);

    GRANT SELECT, INSERT, UPDATE, DELETE ON threat_indicators TO asix_admin;
    GRANT SELECT, INSERT, UPDATE, DELETE ON ioc_scan_state TO asix_admin;

    -- ============================================================
    -- Collectors: ingestion keys (installers) and registered senders
    -- ============================================================

    CREATE TABLE IF NOT EXISTS ingestion_keys (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        tenant_id UUID REFERENCES tenants(id) NOT NULL,
        name VARCHAR(100) NOT NULL,
        description TEXT,
        platform VARCHAR(20) NOT NULL DEFAULT 'linux',
        key_prefix VARCHAR(16) NOT NULL,
        key_hash CHAR(64) NOT NULL UNIQUE,
        status VARCHAR(20) NOT NULL DEFAULT 'active',
        created_by TEXT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        last_used_at TIMESTAMP,
        revoked_at TIMESTAMP,
        UNIQUE (tenant_id, name)
    );

    CREATE TABLE IF NOT EXISTS collectors (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        tenant_id UUID REFERENCES tenants(id) NOT NULL,
        key_id UUID REFERENCES ingestion_keys(id) ON DELETE SET NULL,
        name VARCHAR(200) NOT NULL,
        alias VARCHAR(200),
        platform VARCHAR(20),
        os VARCHAR(100),
        version VARCHAR(50),
        last_ip VARCHAR(64),
        first_seen TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        last_seen TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        events_total BIGINT NOT NULL DEFAULT 0,
        UNIQUE (tenant_id, name)
    );

    ALTER TABLE ingestion_keys ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS ingestion_keys_tenant_isolation ON ingestion_keys;
    CREATE POLICY ingestion_keys_tenant_isolation ON ingestion_keys
        FOR ALL TO PUBLIC
        USING (tenant_id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (tenant_id = current_setting('app.current_tenant_id')::UUID);

    ALTER TABLE collectors ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS collectors_tenant_isolation ON collectors;
    CREATE POLICY collectors_tenant_isolation ON collectors
        FOR ALL TO PUBLIC
        USING (tenant_id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (tenant_id = current_setting('app.current_tenant_id')::UUID);

    CREATE INDEX IF NOT EXISTS idx_collectors_tenant_seen ON collectors(tenant_id, last_seen);
    CREATE INDEX IF NOT EXISTS idx_collectors_key ON collectors(key_id);

    GRANT SELECT, INSERT, UPDATE, DELETE ON ingestion_keys TO asix_admin;
    GRANT SELECT, INSERT, UPDATE, DELETE ON collectors TO asix_admin;

    -- ============================================================
    -- Alert notifications: channels (email / Slack / webhook) and the delivery outbox
    -- ============================================================

    CREATE TABLE IF NOT EXISTS notification_channels (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        tenant_id UUID REFERENCES tenants(id) NOT NULL,
        name VARCHAR(100) NOT NULL,
        type VARCHAR(20) NOT NULL,
        enabled BOOLEAN NOT NULL DEFAULT true,
        min_severity VARCHAR(20) NOT NULL DEFAULT 'high',
        rule_filter VARCHAR(100),
        config_enc TEXT NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE (tenant_id, name)
    );

    CREATE TABLE IF NOT EXISTS notification_deliveries (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        tenant_id UUID REFERENCES tenants(id) NOT NULL,
        channel_id UUID REFERENCES notification_channels(id) ON DELETE CASCADE NOT NULL,
        alert_id UUID REFERENCES alerts(id) ON DELETE CASCADE NOT NULL,
        status VARCHAR(20) NOT NULL DEFAULT 'pending',
        attempts INTEGER NOT NULL DEFAULT 0,
        next_attempt_at TIMESTAMP NOT NULL DEFAULT localtimestamp,
        last_error TEXT,
        sent_at TIMESTAMP,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE (channel_id, alert_id)
    );

    ALTER TABLE notification_channels ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS notification_channels_tenant_isolation ON notification_channels;
    CREATE POLICY notification_channels_tenant_isolation ON notification_channels
        FOR ALL TO PUBLIC
        USING (tenant_id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (tenant_id = current_setting('app.current_tenant_id')::UUID);

    ALTER TABLE notification_deliveries ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS notification_deliveries_tenant_isolation ON notification_deliveries;
    CREATE POLICY notification_deliveries_tenant_isolation ON notification_deliveries
        FOR ALL TO PUBLIC
        USING (tenant_id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (tenant_id = current_setting('app.current_tenant_id')::UUID);

    CREATE INDEX IF NOT EXISTS idx_notif_deliveries_due ON notification_deliveries(tenant_id, status, next_attempt_at);
    CREATE INDEX IF NOT EXISTS idx_notif_deliveries_channel ON notification_deliveries(channel_id, created_at);

    GRANT SELECT, INSERT, UPDATE, DELETE ON notification_channels TO asix_admin;
    GRANT SELECT, INSERT, UPDATE, DELETE ON notification_deliveries TO asix_admin;

    -- ============================================================
    -- Storage & retention
    --   * events becomes a table partitioned by DAY (received_at). Old data is removed by
    --     dropping whole partitions (instant, frees disk at once) or, for shorter per-source
    --     rules, by batched deletes. New partitions are created ahead of time by the API.
    --   * retention settings/policies per tenant, and a log of purge runs.
    -- ============================================================

    CREATE TABLE IF NOT EXISTS retention_settings (
        tenant_id UUID PRIMARY KEY REFERENCES tenants(id),
        auto_purge BOOLEAN NOT NULL DEFAULT false,
        default_days INTEGER NOT NULL DEFAULT 90 CHECK (default_days BETWEEN 1 AND 3650),
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_by TEXT
    );

    CREATE TABLE IF NOT EXISTS retention_policies (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        tenant_id UUID REFERENCES tenants(id) NOT NULL,
        source_type VARCHAR(100) NOT NULL,
        retention_days INTEGER CHECK (retention_days IS NULL OR retention_days BETWEEN 1 AND 3650),
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE (tenant_id, source_type)
    );

    CREATE TABLE IF NOT EXISTS retention_runs (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        tenant_id UUID REFERENCES tenants(id),
        trigger VARCHAR(20) NOT NULL,
        status VARCHAR(20) NOT NULL DEFAULT 'running',
        started_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        finished_at TIMESTAMP,
        partitions_dropped INTEGER NOT NULL DEFAULT 0,
        rows_deleted BIGINT NOT NULL DEFAULT 0,
        detail JSONB,
        error TEXT
    );

    ALTER TABLE retention_settings ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS retention_settings_tenant_isolation ON retention_settings;
    CREATE POLICY retention_settings_tenant_isolation ON retention_settings FOR ALL TO PUBLIC
        USING (tenant_id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (tenant_id = current_setting('app.current_tenant_id')::UUID);
    ALTER TABLE retention_policies ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS retention_policies_tenant_isolation ON retention_policies;
    CREATE POLICY retention_policies_tenant_isolation ON retention_policies FOR ALL TO PUBLIC
        USING (tenant_id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (tenant_id = current_setting('app.current_tenant_id')::UUID);
    ALTER TABLE retention_runs ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS retention_runs_tenant_isolation ON retention_runs;
    CREATE POLICY retention_runs_tenant_isolation ON retention_runs FOR ALL TO PUBLIC
        USING (tenant_id IS NULL OR tenant_id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (tenant_id IS NULL OR tenant_id = current_setting('app.current_tenant_id')::UUID);

    CREATE INDEX IF NOT EXISTS idx_retention_runs_started ON retention_runs(started_at DESC);
    GRANT SELECT, INSERT, UPDATE, DELETE ON retention_settings TO asix_admin;
    GRANT SELECT, INSERT, UPDATE, DELETE ON retention_policies TO asix_admin;
    GRANT SELECT, INSERT, UPDATE, DELETE ON retention_runs TO asix_admin;

    -- ============================================================
    -- Capacity samples: one row every few minutes (platform-level, not per tenant), 30 days kept
    -- ============================================================
    CREATE TABLE IF NOT EXISTS capacity_samples (
        id BIGSERIAL PRIMARY KEY,
        sampled_at TIMESTAMP NOT NULL DEFAULT localtimestamp,
        cpu_pct REAL, load1 REAL, cpu_count INTEGER,
        mem_total_bytes BIGINT, mem_available_bytes BIGINT, swap_used_bytes BIGINT,
        disk_total_bytes BIGINT, disk_free_bytes BIGINT,
        db_bytes BIGINT, events_bytes BIGINT, events_per_min REAL,
        pg_connections INTEGER, pg_max_connections INTEGER, cache_hit_ratio REAL,
        pods_total INTEGER, pods_not_ready INTEGER, restarts_total INTEGER, oom_kills_24h INTEGER
    );
    CREATE INDEX IF NOT EXISTS idx_capacity_samples_time ON capacity_samples(sampled_at);
    GRANT SELECT, INSERT, UPDATE, DELETE ON capacity_samples TO asix_admin;
    GRANT USAGE, SELECT ON SEQUENCE capacity_samples_id_seq TO asix_admin;

    -- One-time, atomic conversion of events to a daily-partitioned table. The block either
    -- completes (row counts verified, old table dropped) or rolls back and fails the deploy,
    -- leaving the original table untouched. deploy.sh takes a pg_dump just before this runs.
    -- Skipped (with a NOTICE) when the table is very large: raise the limit or force it with
    --   PGOPTIONS='-c asix.force_partition_migration=on'
    DO $mig$
    DECLARE
        kind "char";
        n BIGINT;
        mn DATE;
        mx DATE;
        d DATE;
        idx RECORD;
        max_rows BIGINT := COALESCE(NULLIF(current_setting('asix.partition_migration_max_rows', true), '')::bigint, 2000000);
        forced BOOLEAN := COALESCE(current_setting('asix.force_partition_migration', true), '') = 'on';
    BEGIN
        SELECT c.relkind INTO kind FROM pg_class c WHERE c.oid = 'public.events'::regclass;
        IF kind = 'p' THEN
            RETURN;
        END IF;
        SELECT count(*), min(received_at)::date, max(received_at)::date INTO n, mn, mx FROM events;
        IF NOT forced AND n > max_rows THEN
            RAISE NOTICE 'events has % rows (> %): automatic partition migration skipped. Retention still works (row deletes only).', n, max_rows;
            RETURN;
        END IF;
        IF NOT forced AND mn IS NOT NULL AND (mx - mn) > 400 THEN
            RAISE NOTICE 'events spans % days (> 400): automatic partition migration skipped.', (mx - mn);
            RETURN;
        END IF;

        ALTER TABLE events RENAME TO events_unpartitioned;
        FOR idx IN SELECT indexname FROM pg_indexes WHERE schemaname = 'public' AND tablename = 'events_unpartitioned' LOOP
            EXECUTE format('ALTER INDEX %I RENAME TO %I', idx.indexname, 'old_' || idx.indexname);
        END LOOP;

        CREATE TABLE events (
            id UUID NOT NULL DEFAULT uuid_generate_v4(),
            tenant_id UUID REFERENCES tenants(id) NOT NULL,
            source_type VARCHAR(100) NOT NULL,
            collector_id VARCHAR(255),
            received_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
            event_time TIMESTAMP,
            raw TEXT NOT NULL,
            parsed JSONB DEFAULT '{}'::jsonb,
            created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
            PRIMARY KEY (id, received_at)
        ) PARTITION BY RANGE (received_at);

        CREATE TABLE events_default PARTITION OF events DEFAULT;

        FOR d IN SELECT (generate_series(LEAST(COALESCE(mn, CURRENT_DATE), CURRENT_DATE - 1), GREATEST(COALESCE(mx, CURRENT_DATE), CURRENT_DATE) + 7, interval '1 day'))::date LOOP
            EXECUTE format('CREATE TABLE %I PARTITION OF events FOR VALUES FROM (%L) TO (%L)',
                           'events_p' || to_char(d, 'YYYYMMDD'), d, d + 1);
        END LOOP;

        INSERT INTO events (id, tenant_id, source_type, collector_id, received_at, event_time, raw, parsed, created_at)
            SELECT id, tenant_id, source_type, collector_id, COALESCE(received_at, created_at, localtimestamp), event_time, raw, parsed, created_at
            FROM events_unpartitioned;

        IF (SELECT count(*) FROM events) <> n THEN
            RAISE EXCEPTION 'events partition migration: row count mismatch (expected %)', n;
        END IF;
        DROP TABLE events_unpartitioned;
        RAISE NOTICE 'events converted to a daily-partitioned table (% rows moved)', n;
    END
    $mig$;

    -- (Re)create everything that hangs off events; all of this is idempotent.
    ALTER TABLE events ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS events_tenant_isolation ON events;
    CREATE POLICY events_tenant_isolation ON events
        FOR ALL TO PUBLIC
        USING (tenant_id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (tenant_id = current_setting('app.current_tenant_id')::UUID);
    CREATE INDEX IF NOT EXISTS idx_events_tenant_id ON events(tenant_id);
    CREATE INDEX IF NOT EXISTS idx_events_event_time ON events(event_time);
    CREATE INDEX IF NOT EXISTS idx_events_source_type ON events(source_type);
    CREATE INDEX IF NOT EXISTS idx_events_parsed_gin ON events USING GIN (parsed);
    CREATE INDEX IF NOT EXISTS idx_events_tenant_received ON events(tenant_id, received_at, id);
    GRANT SELECT, INSERT, UPDATE, DELETE ON events TO asix_admin;

    -- Parsing rules: one user-defined ruleset per tenant (XQL-style text, validated on save).
    CREATE TABLE IF NOT EXISTS parsing_rules (
        tenant_id UUID PRIMARY KEY REFERENCES tenants(id) ON DELETE CASCADE,
        content TEXT NOT NULL,
        version INTEGER NOT NULL DEFAULT 1,
        updated_by UUID,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    ALTER TABLE parsing_rules ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS parsing_rules_tenant_isolation ON parsing_rules;
    CREATE POLICY parsing_rules_tenant_isolation ON parsing_rules
        FOR ALL TO PUBLIC
        USING (tenant_id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (tenant_id = current_setting('app.current_tenant_id')::UUID);

    GRANT SELECT, INSERT, UPDATE, DELETE ON parsing_rules TO asix_admin;

    -- Data model rules: one user-defined ruleset per tenant (maps datasets onto XDM fields).
    CREATE TABLE IF NOT EXISTS data_model_rules (
        tenant_id UUID PRIMARY KEY REFERENCES tenants(id) ON DELETE CASCADE,
        content TEXT NOT NULL,
        version INTEGER NOT NULL DEFAULT 1,
        updated_by UUID,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    ALTER TABLE data_model_rules ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS data_model_rules_tenant_isolation ON data_model_rules;
    CREATE POLICY data_model_rules_tenant_isolation ON data_model_rules
        FOR ALL TO PUBLIC
        USING (tenant_id = current_setting('app.current_tenant_id')::UUID)
        WITH CHECK (tenant_id = current_setting('app.current_tenant_id')::UUID);

    GRANT SELECT, INSERT, UPDATE, DELETE ON data_model_rules TO asix_admin;

---
apiVersion: batch/v1
kind: Job
metadata:
  name: asix-schema-init
  namespace: asix-platform
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: asix-schema-init
          image: postgres:16-alpine
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_PASSWORD
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export PGPASSWORD="$ADMIN_PASSWORD"
              PSQL="psql -h postgresql -U asix_admin -d asix_platform -v ON_ERROR_STOP=1"

              # schema.sql is fully idempotent (IF NOT EXISTS / DROP+CREATE
              # POLICY throughout) — always apply it rather than gating on
              # whether one specific table exists, which silently stops
              # applying new additions the moment that table is present.
              echo "Applying src/db/schema.sql"
              $PSQL -f /schema/schema.sql
              echo "Schema applied"
          volumeMounts:
            - name: schema-volume
              mountPath: /schema
      volumes:
        - name: schema-volume
          configMap:
            name: asix-db-schema
