apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-db-init
  namespace: asix-platform
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: keycloak-db-init
          image: postgres:16-alpine
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_PASSWORD
            - name: KEYCLOAK_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: PASSWORD
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export PGPASSWORD="$ADMIN_PASSWORD"
              PSQL="psql -h postgresql -U asix_admin -d postgres -v ON_ERROR_STOP=1"

              ROLE_EXISTS=$($PSQL -tAc "SELECT 1 FROM pg_roles WHERE rolname='keycloak'")
              if [ "$ROLE_EXISTS" != "1" ]; then
                echo "Creating role 'keycloak'"
                $PSQL -c "CREATE ROLE keycloak WITH LOGIN PASSWORD '${KEYCLOAK_DB_PASSWORD}';"
              else
                echo "Role 'keycloak' already exists — syncing password"
                $PSQL -c "ALTER ROLE keycloak WITH LOGIN PASSWORD '${KEYCLOAK_DB_PASSWORD}';"
              fi

              DB_EXISTS=$($PSQL -tAc "SELECT 1 FROM pg_database WHERE datname='keycloak'")
              if [ "$DB_EXISTS" != "1" ]; then
                echo "Creating database 'keycloak' owned by role 'keycloak'"
                $PSQL -c "CREATE DATABASE keycloak OWNER keycloak;"
              else
                echo "Database 'keycloak' already exists"
              fi

              # Postgres 15+ revokes CREATE on 'public' from non-owners by default;
              # make sure the keycloak role actually owns its own public schema.
              psql -h postgresql -U asix_admin -d keycloak -v ON_ERROR_STOP=1 -c \
                "GRANT ALL ON SCHEMA public TO keycloak; ALTER SCHEMA public OWNER TO keycloak;"

              echo "keycloak database ready"
