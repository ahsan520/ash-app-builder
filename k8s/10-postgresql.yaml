apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: asix-platform
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      # Time for a clean (fast) shutdown: flushes WAL and checkpoints, so the next start needs no crash recovery.
      terminationGracePeriodSeconds: 120
      containers:
        - name: postgresql
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "asix_platform"
            - name: POSTGRES_USER
              value: "asix_admin"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "asix_admin", "-d", "asix_platform"]
            initialDelaySeconds: 5
            periodSeconds: 10
          # Crash recovery after an unclean stop can take minutes on a big database. Until this probe
          # succeeds the liveness probe is not run, so Kubernetes cannot kill Postgres mid-recovery
          # (which would restart the recovery and could loop forever).
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "asix_admin", "-d", "asix_platform"]
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "asix_admin", "-d", "asix_platform"]
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              # SIGINT = "fast" shutdown. Kubernetes' own SIGTERM would be a "smart" shutdown that waits
              # for every client to disconnect and usually runs into the kill timeout instead.
              exec:
                command: ["sh", "-c", "kill -INT 1; i=0; while kill -0 1 2>/dev/null && [ $i -lt 110 ]; do sleep 1; i=$((i+1)); done"]
  volumeClaimTemplates:
    - metadata:
        name: postgresql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: asix-platform
spec:
  selector:
    app: postgresql
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
