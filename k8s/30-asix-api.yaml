apiVersion: apps/v1
kind: Deployment
metadata:
  name: asix-api
  namespace: asix-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: asix-api
  template:
    metadata:
      labels:
        app: asix-api
    spec:
      serviceAccountName: asix-api          # read-only cluster view for Settings > Capacity (k8s/31-capacity-rbac.yaml)
      containers:
        - name: asix-api
          image: asix-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: "postgresql"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "asix_platform"
            - name: DB_USER
              value: "asix_admin"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_PASSWORD
            - name: BROKER_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: broker-ingest-secret
                  key: BROKER_INGEST_TOKEN
            # Notification channels: AES key for stored secrets (created by deploy.sh)
            - name: NOTIFY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: asix-notify-secret
                  key: NOTIFY_ENCRYPTION_KEY
                  optional: true
            # "true" lets webhooks / SMTP target private networks (RFC1918). Loopback, link-local
            # and cloud-metadata addresses stay blocked either way.
            - name: NOTIFY_ALLOW_PRIVATE_TARGETS
              value: "false"
            # Base URL used for "Open in ASIX" links in notifications (filled in by deploy.sh)
            - name: ASIX_PUBLIC_URL
              value: "__ASIX_PUBLIC_URL__"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /v1/health/status
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: asix-api
  namespace: asix-platform
spec:
  selector:
    app: asix-api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: NodePort
