apiVersion: apps/v1
kind: Deployment
metadata:
  name: asix-api
  namespace: asix-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: asix-api
  template:
    metadata:
      labels:
        app: asix-api
    spec:
      serviceAccountName: asix-api          # read-only cluster view for Settings > Capacity (k8s/31-capacity-rbac.yaml)
      containers:
        - name: asix-api
          image: asix-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: "postgresql"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "asix_platform"
            - name: DB_USER
              value: "asix_admin"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_PASSWORD
            - name: BROKER_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: broker-ingest-secret
                  key: BROKER_INGEST_TOKEN
            # Notification channels: AES key for stored secrets (created by deploy.sh)
            - name: NOTIFY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: asix-notify-secret
                  key: NOTIFY_ENCRYPTION_KEY
                  optional: true
            # Signs the answers of the broker config pull (src/brokers/config-signing.js). Optional: without the Secret the answers are
            # unsigned, as before. Create it with scripts/deploy/make-config-signing-key.sh.
            - name: ASIX_CONFIG_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: asix-config-signing
                  key: ASIX_CONFIG_SIGNING_KEY
                  optional: true
            # "true" lets webhooks / SMTP target private networks (RFC1918). Loopback, link-local
            # and cloud-metadata addresses stay blocked either way.
            - name: NOTIFY_ALLOW_PRIVATE_TARGETS
              value: "false"
            # Base URL used for "Open in ASIX" links in notifications (filled in by deploy.sh)
            - name: ASIX_PUBLIC_URL
              value: "__ASIX_PUBLIC_URL__"
            # Parser workers (src/ingestion/parser-pool.js): "0" parses inline in the API process (the default and the
            # previous behaviour). "2" parses on two worker threads per replica with a time limit per batch, so a
            # runaway pattern or a parser crash cannot freeze or kill the API. Each worker is capped at 192 MB of heap
            # and adds roughly 40-60 MB, so raise the memory limit below when you turn it on (for example 768Mi).
            - name: ASIX_PARSER_WORKERS
              value: "0"
            - name: ASIX_PARSER_TIMEOUT_MS
              value: "5000"
            # Collector watchdog (src/collectors/watchdog.js): raises an alert when a collector you turned "Alert if down"
            # on for goes Disconnected. Nothing is raised for collectors you did not choose. SEVERITY is the alert's severity
            # (high = a notification channel's default minimum); GRACE is how long after an API start no new alert is raised,
            # because collectors could not report while the API was down.
            - name: ASIX_WATCHDOG_SEVERITY
              value: "high"
            - name: ASIX_WATCHDOG_GRACE_SECONDS
              value: "300"
            # Unparsed-events alert (src/ingestion/parse-watch.js): one alert when at least this many events were stored unparsed in the
            # window (minutes). "0" = off. Runs in the watchdog cycle above, so the severity and grace settings apply.
            - name: ASIX_PARSE_ALERT_MIN_EVENTS
              value: "0"
            - name: ASIX_PARSE_ALERT_WINDOW_MIN
              value: "15"
            # Event store (src/events): "postgres" (default) or "clickhouse". Switching does NOT copy existing events: run
            # src/events/copy-events.js first (docs/clickhouse-server.md, "Switching the API to ClickHouse"). The nightly backup
            # covers both: the PostgreSQL sets and, when ClickHouse is deployed, its events (docs/clickhouse-backup.md). The
            # ClickHouse server itself is k8s/11-clickhouse.yaml (deploy.sh --with-clickhouse); without it, "clickhouse" here
            # stops the API at start. Set to "clickhouse" on the k3s box on 2026-10-17.
            - name: ASIX_EVENT_STORE
              value: "clickhouse"
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-secret
                  key: CLICKHOUSE_PASSWORD
                  optional: true
            - name: ASIX_CLICKHOUSE_URL
              value: "http://asix:$(CLICKHOUSE_PASSWORD)@clickhouse:8123/asix"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /v1/health/status
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: asix-api
  namespace: asix-platform
spec:
  selector:
    app: asix-api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: NodePort
