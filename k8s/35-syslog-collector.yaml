apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: syslog-collector-spool
  namespace: asix-platform
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# This is the Collector/Broker tier (architecture.md: Data Source ->
# Collector -> Broker -> ... -> Storage), NOT the data node. It holds no
# DB credentials — only INGEST_API_URL + INGEST_API_TOKEN to reach the
# data node's ingestion endpoint. Running it in-cluster like this is one
# valid deployment shape; the same image/command also runs as a
# standalone broker VM outside the cluster (see deploy/ and
# scripts/bootstrap-syslog-collector.sh) for a site/segment that isn't
# part of this k8s cluster at all.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asix-syslog-collector
  namespace: asix-platform
spec:
  # Single replica: two replicas would each open their own spool file and
  # both try to bind the same NodePort — this isn't a horizontally
  # scaled service in Phase 1, it's one collector process.
  replicas: 1
  selector:
    matchLabels:
      app: asix-syslog-collector
  template:
    metadata:
      labels:
        app: asix-syslog-collector
    spec:
      # The container runs as the Dockerfile's non-root 'node' user, and
      # the spool PVC is otherwise mounted root-owned by default on most
      # storage classes (including k3s local-path) — without this, the
      # spool would only fail once actually needed (during a data-node
      # outage), which is the worst time to discover an EACCES.
      securityContext:
        fsGroup: 1000
      containers:
        - name: asix-syslog-collector
          # Same image as asix-api — src/ingestion is already baked in by
          # the existing Dockerfile (COPY src ./src). No separate image
          # or build step needed, just a different entrypoint command.
          image: asix-api:local
          imagePullPolicy: IfNotPresent
          command: ["node", "src/ingestion/syslog-server.js"]
          ports:
            - name: syslog-udp
              containerPort: 5514
              protocol: UDP
            - name: syslog-tcp
              containerPort: 5514
              protocol: TCP
          env:
            # No DB_* credentials here — the broker never touches
            # Postgres directly, only the data node's ingest API.
            - name: INGEST_API_URL
              value: "http://asix-api:3000/v1/ingest/events"
            - name: INGEST_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: broker-ingest-secret
                  key: BROKER_INGEST_TOKEN
            # Resolved by name at the data node — asix-seed-identity
            # creates "Default Tenant" but its UUID isn't known ahead of
            # time, so there's nothing static to put in a Secret here.
            - name: SYSLOG_TENANT_NAME
              value: "Default Tenant"
            - name: SYSLOG_COLLECTOR_ID
              value: "k8s-syslog-1"
            - name: SYSLOG_UDP_PORT
              value: "5514"
            - name: SYSLOG_TCP_PORT
              value: "5514"
            - name: SYSLOG_SPOOL_PATH
              value: "/var/lib/asix/syslog-spool.ndjson"
          volumeMounts:
            - name: spool
              mountPath: /var/lib/asix
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          # No HTTP endpoint here — a raw TCP connect is the honest
          # readiness signal for this process.
          readinessProbe:
            tcpSocket:
              port: 5514
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5514
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: spool
          persistentVolumeClaim:
            claimName: syslog-collector-spool
---
apiVersion: v1
kind: Service
metadata:
  name: asix-syslog-collector
  namespace: asix-platform
spec:
  selector:
    app: asix-syslog-collector
  type: NodePort
  ports:
    - name: syslog-udp
      port: 5514
      targetPort: 5514
      protocol: UDP
      nodePort: 30514
    - name: syslog-tcp
      port: 5514
      targetPort: 5514
      protocol: TCP
      nodePort: 30514
