  .bb-ent { margin-top:26px; } .bb-eh { display:flex; align-items:center; gap:10px; margin-left:-39px; }

<body>
<div id="login" class="center hidden">
  <div class="brand" style="font-size:28px;border:0">ASIX <b>Portal</b></div>
  <div class="mute">SIEM control plane and log search</div>
  <button class="btn pri" id="signin">Sign in</button>
  <div id="loginerr" class="err"></div>
</div>
<div id="app" class="hidden">
  <aside id="side"><div class="brand">ASIX <b>Portal</b></div><div id="nav"></div><div id="bottom"></div></aside>
  <div id="mainp"><div id="top"><div id="crumb"></div></div><main id="content"></main></div>
</div>
<script>
'use strict';
// ---- config -----------------------------------------------------------------
// Keycloak is published by nginx on its own HTTPS port (see k8s/40-nginx.yaml).
const KC_PORT = 30444;
const ISSUER = 'https://' + location.hostname + ':' + KC_PORT + '/realms/asix';
const OIDC = ISSUER + '/protocol/openid-connect';
const CLIENT_ID = 'asix-portal';
const REDIRECT = location.origin + '/portal/';
const $ = (id) => document.getElementById(id);
const S = sessionStorage;

// ---- helpers (all dynamic text goes through textContent: log lines are untrusted) --
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  Object.assign(e, props || {});
  kids.flat().forEach((k) => e.append(k));
  return e;
}
const b64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const rand = () => b64url(crypto.getRandomValues(new Uint8Array(32)));
function kv(obj) {
  const box = el('div');
  Object.entries(obj).forEach(([k, v]) => box.append(el('div', { className: 'kv' }, el('span', { textContent: k }), el('span', { textContent: v === null || v === undefined ? '-' : typeof v === 'object' ? JSON.stringify(v) : String(v) }))));
  return box;
}
function jwtClaims(t) { try { return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); } catch { return {}; } }

// ---- OIDC authorization code + PKCE ----------------------------------------------
async function login() {
  const verifier = rand(), state = rand();
  S.setItem('pkce', JSON.stringify({ verifier, state }));
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  location.href = OIDC + '/auth?' + new URLSearchParams({ client_id: CLIENT_ID, redirect_uri: REDIRECT, response_type: 'code', scope: 'openid profile', state, code_challenge: challenge, code_challenge_method: 'S256' });
}
async function tokenRequest(params) {
  const r = await fetch(OIDC + '/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ client_id: CLIENT_ID, ...params }) });
  if (!r.ok) throw new Error('token endpoint returned ' + r.status);
  const t = await r.json();
  S.setItem('tok', JSON.stringify({ access: t.access_token, refresh: t.refresh_token, id: t.id_token, exp: Date.now() + (t.expires_in - 10) * 1000 }));
}
async function finishLogin() {
  const q = new URLSearchParams(location.search);
  if (!q.get('code')) return;
  const saved = JSON.parse(S.getItem('pkce') || '{}');
  S.removeItem('pkce');
  history.replaceState(null, '', REDIRECT);
  if (!saved.state || saved.state !== q.get('state')) throw new Error('login state mismatch');
  await tokenRequest({ grant_type: 'authorization_code', code: q.get('code'), redirect_uri: REDIRECT, code_verifier: saved.verifier });
}
async function accessToken() {
  let t = JSON.parse(S.getItem('tok') || 'null');
  if (!t) return null;
  if (Date.now() >= t.exp && t.refresh) {
    try { await tokenRequest({ grant_type: 'refresh_token', refresh_token: t.refresh }); t = JSON.parse(S.getItem('tok')); }
    catch { S.removeItem('tok'); return null; }
  }
  return t.access;
}
function logout() {
  const t = JSON.parse(S.getItem('tok') || '{}');
  S.removeItem('tok');
  const p = { client_id: CLIENT_ID, post_logout_redirect_uri: REDIRECT };
  if (t.id) p.id_token_hint = t.id;
  location.href = OIDC + '/logout?' + new URLSearchParams(p);
}
async function api(path, opts = {}) {

      r.truncated ? pill('truncated by limit', 'off') : '', r.count > SHOW ? el('span', { className: 'mute', textContent: 'showing first ' + SHOW + ' - download for all' }) : '', el('span', { style: 'flex:1' }), disp, dl),
      el('div', { className: 'xres' }, fieldsPanel(), el('div', { className: 'xtbl' }, r.count ? t : el('div', { className: 'mute', style: 'padding:14px', textContent: 'No events matched in this time range.' }))));
  }

// ---- Modules & edition -----------------------------------------------------------------------
const MOD_STATE = { enabled: ['On', 'ok'], locked: ['Locked', 'off'], planned: ['Planned', 'off'] };
const modWhy = (m) => (m.state === 'planned' ? (m.included_in_profile ? 'Not built yet' : 'Not built yet; needs the Enterprise profile')
  : !m.reason ? '' : m.reason === 'profile' ? 'Needs the Enterprise profile'
  : m.reason === 'license' ? 'Needs a license that includes "' + m.entitlement + '"' : 'Needs ' + m.reason.replace('dependency:', '') + ' to be on');
async function pgModules() {
  const r = await api('/v1/modules');
  menuSet(r.modules); menuAt = Date.now(); buildNav('modules');   // keep the menu in step with what this page shows
  const lic = r.license;
  const licText = lic.status === 'valid' ? 'valid' + (lic.customer ? ' for ' + lic.customer : '') : lic.status === 'none' ? 'none installed' : lic.status;
  const lim = (v) => (v === null || v === undefined ? 'unlimited' : String(v));
  const on = r.modules.filter((m) => m.state === 'enabled').length;
  return [...head('Modules', 'One platform, two editions. The profile sets the deployment shape and a signed license unlocks extra modules and limits. Menu entries and features follow this list.'),
    el('div', { className: 'grid' },
      card('Edition', kv({ profile: r.profile.label, storage: r.profile.deployment.storage, ingest: r.profile.deployment.ingest, 'high availability': r.profile.deployment.ha ? 'yes' : 'no' })),
      card('License and limits', kv({ license: licText, 'expires (UTC)': lic.expires_at ? when(lic.expires_at) : '-', tenants: lim(r.limits.tenants) + (r.usage && r.usage.tenants !== undefined ? ' (' + r.usage.tenants + ' in use)' : ''), 'retention cap (days)': lim(r.limits.retention_days_max) }),
        lic.reason ? el('div', { className: 'mute', style: 'margin-top:8px', textContent: lic.reason }) : '',
        (r.over_limit || []).length ? el('div', { className: 'warn', style: 'margin-top:8px', textContent: 'Over a limit: ' + r.over_limit.map((o) => o.limit + ' ' + o.used + ' of ' + o.allowed).join(', ') + '. Nothing was removed; adding more is blocked until a license raises it.' }) : '')),
    card('Modules (' + on + ' of ' + r.modules.length + ' on)', table([
      { h: 'Module', f: (m) => m.name }, { h: 'Edition', f: (m) => (m.tier === 'home' ? 'Home' : 'Enterprise') },
      { h: 'State', f: (m) => pill(MOD_STATE[m.state][0], MOD_STATE[m.state][1]) },
      { h: 'Why', f: (m) => modWhy(m) }, { h: 'What it does', f: (m) => m.description }], r.modules))];
}

// ---- Alert triage: assignee + notes --------------------------------------------------------
const noteRow = (n) => el('div', { className: 'card', style: 'margin:6px 0' }, el('div', { className: 'mute', textContent: n.author_name + ' - ' + when(n.created_at) + ' UTC' }), el('div', { style: 'white-space:pre-wrap', textContent: n.body }));
async function triagePanel(a) {
  const [{ users, me }, { notes }] = await Promise.all([api('/v1/alert-assignees'), api('/v1/alerts/' + a.id + '/notes')]);
  const sel = el('select', {}, el('option', { value: '', textContent: 'Unassigned' }), ...users.map((u) => el('option', { value: u.id, textContent: u.username + (u.id === me ? ' (me)' : '') })));
  sel.value = a.assignee_id || '';

  const list = el('div', {}, notes.map(noteRow));
  const ta = el('textarea', { rows: 3, maxLength: 2000, placeholder: 'Add a note for the next analyst...', style: 'width:100%' });
  const add = el('button', { className: 'btn pri', textContent: 'Add note', onclick: async () => {
    const t = ta.value.trim(); if (!t) return;
    try { const r = await api('/v1/alerts/' + a.id + '/notes', { method: 'POST', body: { body: t } }); list.append(noteRow(r.note)); ta.value = ''; } catch (e) { window.alert(e.message); }
  } });
  return el('div', {}, el('h3', { textContent: 'Assignee' }), sel, el('h3', { textContent: 'Notes' }), list, ta, el('div', { style: 'margin-top:8px' }, add));

// ---- Alert dedupe: find and merge repeat alerts ---------------------------------------------------
async function mergedPanel(a) {
  const { merged } = await api('/v1/alerts/' + a.id + '/merged');
  return el('div', {}, el('h3', { textContent: 'Merged repeat alerts' }),
    table([{ h: 'Alert', f: (m) => m.title }, { h: 'Events', f: (m) => m.event_count }, { h: 'First seen (UTC)', f: (m) => when(m.first_event_at || m.created_at) }, { h: 'Last seen (UTC)', f: (m) => when(m.last_event_at) }], merged, 'None.'));
}
async function openDedupe(holder) {
  holder.replaceChildren(el('div', { className: 'mute', textContent: 'Looking for repeat alerts...' }));
  try {
    const r = await api('/v1/alert-duplicates');
    const done = async (fn) => { try { const out = await fn(); window.alert(out.merged + ' alert' + (out.merged === 1 ? '' : 's') + ' merged.'); route(); } catch (e) { window.alert(e.message); } };
    if (!r.groups.length) return holder.replaceChildren(card('Repeat alerts', el('div', { className: 'mute', textContent: 'No repeat alerts. Each active alert is the only one for its rule and group.' })));
    holder.replaceChildren(card('Repeat alerts: ' + r.alert_count + ' alerts in ' + r.group_count + ' groups',
      el('div', { className: 'mute', style: 'margin-bottom:8px', textContent: 'Repeats are active alerts from the same rule and group. Merging keeps the oldest alert, adds up the event counts, closes the others (still readable, linked to it) and moves their notes across.' }),
      el('button', { className: 'btn pri', textContent: 'Merge all groups', onclick: () => { if (window.confirm('Merge every group of repeat alerts into its oldest alert?')) done(() => api('/v1/alert-duplicates/merge', { method: 'POST', body: {} })); } })),
      ...r.groups.map((g) => card(g.rule_name + (g.group_key === 'all' ? '' : ': ' + g.group_key) + '  (' + g.count + ' alerts, ' + g.total_events + ' events)',
        table([{ h: 'Severity', f: (a) => sevPill(a.severity) }, { h: 'Status', f: (a) => a.status }, { h: 'Events', f: (a) => a.event_count }, { h: 'First seen (UTC)', f: (a) => when(a.first_event_at || a.created_at) }, { h: 'Last seen (UTC)', f: (a) => when(a.last_event_at) }, { h: 'Assignee', f: (a) => a.assignee_name || '-' }], g.alerts),
        el('div', { style: 'margin-top:8px' }, el('button', { className: 'btn', textContent: 'Merge into the oldest', onclick: () => { if (window.confirm('Merge ' + (g.alerts.length - 1) + ' alert(s) into the oldest one?')) done(() => api('/v1/alerts/merge', { method: 'POST', body: { primary_id: g.alerts[0].id, ids: g.alerts.slice(1).map((a) => a.id) } })); } })))));
  } catch (e) { holder.replaceChildren(errBox(e)); }
}

// ---- Content packs ---------------------------------------------------------------------------
const PACK_STATE = { available: ['Not installed', 'off'], partial: ['Partly installed', 'off'], installed: ['Installed', 'ok'] };
async function pgPacks() {
  const r = await api('/v1/packs');
  const act = async (fn) => { try { await fn(); route(); } catch (e) { window.alert(e.message); } };
  const btn = (t, f, pri) => el('button', { className: 'btn' + (pri ? ' pri' : ''), style: 'margin-right:4px', textContent: t, onclick: f });
  const remove = async (p) => {
    if (!window.confirm('Remove \"' + p.name + '\"? Its rules are deleted.')) return;
    try { await api('/v1/packs/' + p.id, { method: 'DELETE' }); route(); } catch (e) {
      if (e.status === 409 && window.confirm('Some of these rules have raised alerts. Removing the pack deletes those alerts too. Continue?')) act(() => api('/v1/packs/' + p.id + '?delete_alerts=true', { method: 'DELETE' }));
      else if (e.status !== 409) window.alert(e.message);
    }
  };
  const acts = (p) => el('div', { style: 'margin-top:10px' },
    p.state === 'installed' ? '' : btn(p.state === 'partial' ? 'Add missing rules' : 'Install', () => act(() => api('/v1/packs/' + p.id + '/install', { method: 'POST', body: {} })), true),
    p.state === 'available' ? '' : btn('Restore shipped rules', () => { if (window.confirm('Put every rule from \"' + p.name + '\" back to the version shipped with ASIX? Your edits to these rules will be lost.')) act(() => api('/v1/packs/' + p.id + '/install', { method: 'POST', body: { overwrite: true } })); }),
    p.state === 'available' ? '' : btn('Remove', () => remove(p)));
  return [...head('Content packs', 'Ready-made detection rules for common home setups. Installing a pack adds its rules to Threat Management, where you can edit, disable or tune them like any other rule. Installing again never duplicates a rule or overwrites your edits.'),
    ...r.packs.map((p) => card(p.name + '  v' + p.version,
      el('div', { style: 'margin-bottom:6px' }, pill(PACK_STATE[p.state][0], PACK_STATE[p.state][1]), ' ', el('span', { className: 'mute', textContent: p.installed_rules + ' of ' + p.rule_count + ' rules installed' + (p.open_alerts ? ', ' + p.open_alerts + ' active alert' + (p.open_alerts > 1 ? 's' : '') : '') })),
      el('div', { textContent: p.description }),
      el('div', { className: 'mute', style: 'margin:6px 0', textContent: 'Expects: ' + p.sources.join('; ') }),
      table([{ h: 'Rule', f: (x) => el('div', {}, el('div', { textContent: x.name }), el('div', { className: 'mute', style: 'font-size:12px', textContent: x.description })) },
        { h: 'Severity', f: (x) => sevPill(x.severity) }, { h: 'MITRE', f: (x) => (x.mitre || []).join(', ') }], p.rules),
      acts(p)))];
}

// ---- Menu follows module state ------------------------------------------------------
// Which module each menu path belongs to (path as the router sees it). A module that is not "enabled"
// (locked by profile, license or dependency, or planned) greys its entries and shows an explanation instead of
// calling an API that the module would not serve. Paths missing here are always shown. This only shapes the
// menu: the server decides what is allowed. If /v1/modules cannot be read (no modules:read, network), nothing is
// greyed out.
// BEGIN menu-state (tests/portal-menu.test.js runs this block on its own: no DOM, no api() calls inside it)
const MENU_MODULE = {
  dashboard: 'dashboards', incidents: 'alerts', search: 'search', threat: 'detections', posture: 'posture', packs: 'content-packs',
  'settings/status': 'core', 'settings/account': 'core', 'settings/access': 'core',
  'settings/capacity': 'capacity',
  'settings/sources': 'ingestion', 'settings/collectors': 'ingestion', 'settings/installers': 'ingestion', 'settings/brokers': 'ingestion', 'settings/parsing': 'ingestion', 'settings/parser': 'ingestion', 'settings/winfilter': 'ingestion', 'settings/datamodel': 'ingestion',
  'settings/retention': 'retention', 'settings/safety': 'retention',
  'settings/notify': 'notifications', 'settings/deliveries': 'notifications',
  'threat/library': 'threat-intel', 'threat/indicators': 'threat-intel',
  'threat/ioc': 'detections', 'threat/bioc': 'detections', 'threat/correlations': 'detections',
};
let menuMods = null, menuAt = 0;   // module id -> row from /v1/modules
function menuSet(list) { menuMods = {}; for (const m of list || []) if (m && m.id) menuMods[m.id] = m; }
// the module row when this path's module is NOT on, else null (also null when nothing is known yet)
function menuModule(path) {
  const id = MENU_MODULE[path];
  const m = id && menuMods ? menuMods[id] : null;
  return m && m.state !== 'enabled' ? m : null;
}
// END menu-state
async function ensureMenuState() {
  if (menuMods && Date.now() - menuAt < 60000) return;
  menuAt = Date.now();   // also after a failure, so a user without modules:read does not retry on every click
  try { menuSet((await api('/v1/modules')).modules); } catch { /* keep what we had: nothing is greyed out */ }
}
function lockedPage(m) {
  return [...head(m.name, 'This part of ASIX is not switched on for this installation.'),
    card('Why', el('div', { textContent: modWhy(m) || 'It is not enabled.' }), el('div', { className: 'mute', style: 'margin-top:8px', textContent: m.description || '' }),
      el('div', { style: 'margin-top:10px' }, el('button', { className: 'btn pri', textContent: 'Open Modules', onclick: () => { location.hash = '#/modules'; } })))];
}

// ---- My open alerts tile (Command Center) -------------------------------------------------
// Alerts assigned to the signed-in user that are still open or acknowledged (GET /v1/my-alerts). Shows nothing for
// a service account, when the call fails, or when the alerts module is not on.
function myAlertsTile(m) {
  if (!m || !m.applicable || menuModule('incidents')) return '';
  const link = (label, q) => el('a', { href: '#/incidents?assignee=' + q, textContent: label });
  if (!m.active_total) return el('div', { style: 'margin-top:14px' }, card('My open alerts', el('div', { className: 'mute', textContent: 'Nothing is assigned to you.' }), el('div', { style: 'margin-top:8px' }, link('See unassigned alerts', 'unassigned'))));
  return el('div', { style: 'margin-top:14px' }, card('My open alerts',
    el('div', { style: 'display:flex;align-items:center;gap:10px;flex-wrap:wrap' }, el('b', { textContent: m.active_total + ' active' }),
      el('span', { className: 'mute', textContent: m.open + ' open, ' + m.acknowledged + ' acknowledged' + (m.oldest_open_at ? '; oldest unhandled for ' + ago(m.oldest_open_at) : '') }),
      ...SEV.filter((x) => m.active[x]).map((x) => el('a', { href: '#/incidents?assignee=me&sev=' + x, style: 'text-decoration:none' }, sevPill(x, m.active[x])))),
    table([{ h: 'Severity', f: (a) => sevPill(a.severity) }, { h: 'Alert', f: (a) => el('a', { href: '#/incidents?assignee=me', textContent: a.title }) },
      { h: 'Status', f: (a) => pill(a.status, a.status === 'open' ? 'bad' : 'ok') }, { h: 'Last seen', f: (a) => ago(a.last_event_at) }], m.alerts),
    m.active_total > m.alerts.length ? el('div', { style: 'margin-top:8px' }, link('See all ' + m.active_total + ' of my alerts', 'me')) : ''));
}

// ---- boot ---------------------------------------------------------------------------
$('signin').onclick = login;
window.addEventListener('hashchange', () => { if (!$('app').classList.contains('hidden')) route(); });
(async () => {
  try {
    if (!crypto.subtle) throw new Error('This page needs HTTPS (secure context). Use the https:// address.');
    await finishLogin();
    const tok = await accessToken();
    if (!tok) return showLogin();
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    username = jwtClaims(tok).preferred_username || '';
    setTheme(theme());
    api('/v1/auth/me').then((m) => { tenantName = m.tenant_name; }).catch(() => { tenantName = 'no tenant'; }).finally(route);
  } catch (e) { showLogin(e.message); }
})();
function showLogin(msg) { $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('loginerr').textContent = msg || ''; }
