  .bb-ent { margin-top:26px; } .bb-eh { display:flex; align-items:center; gap:10px; margin-left:-39px; }

<body>
<div id="login" class="center hidden">
  <div class="brand" style="font-size:28px;border:0">ASIX <b>Portal</b></div>
  <div class="mute">SIEM control plane and log search</div>
  <button class="btn pri" id="signin">Sign in</button>
  <div id="loginerr" class="err"></div>
</div>
<div id="app" class="hidden">
  <aside id="side"><div class="brand">ASIX <b>Portal</b></div><div id="nav"></div><div id="bottom"></div></aside>
  <div id="mainp"><div id="top"><div id="crumb"></div></div><main id="content"></main></div>
</div>
<script>
'use strict';
// ---- config -----------------------------------------------------------------
// Keycloak is published by nginx on its own HTTPS port (see k8s/40-nginx.yaml).
const KC_PORT = 30444;
const ISSUER = 'https://' + location.hostname + ':' + KC_PORT + '/realms/asix';
const OIDC = ISSUER + '/protocol/openid-connect';
const CLIENT_ID = 'asix-portal';
const REDIRECT = location.origin + '/portal/';
const $ = (id) => document.getElementById(id);
const S = sessionStorage;

// ---- helpers (all dynamic text goes through textContent: log lines are untrusted) --
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  Object.assign(e, props || {});
  kids.flat().forEach((k) => e.append(k));
  return e;
}
const b64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const rand = () => b64url(crypto.getRandomValues(new Uint8Array(32)));
function kv(obj) {
  const box = el('div');
  Object.entries(obj).forEach(([k, v]) => box.append(el('div', { className: 'kv' }, el('span', { textContent: k }), el('span', { textContent: v === null || v === undefined ? '-' : typeof v === 'object' ? JSON.stringify(v) : String(v) }))));
  return box;
}
function jwtClaims(t) { try { return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); } catch { return {}; } }

// ---- OIDC authorization code + PKCE ----------------------------------------------
async function login() {
  const verifier = rand(), state = rand();
  S.setItem('pkce', JSON.stringify({ verifier, state }));
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  location.href = OIDC + '/auth?' + new URLSearchParams({ client_id: CLIENT_ID, redirect_uri: REDIRECT, response_type: 'code', scope: 'openid profile', state, code_challenge: challenge, code_challenge_method: 'S256' });
}
async function tokenRequest(params) {
  const r = await fetch(OIDC + '/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ client_id: CLIENT_ID, ...params }) });
  if (!r.ok) throw new Error('token endpoint returned ' + r.status);
  const t = await r.json();
  S.setItem('tok', JSON.stringify({ access: t.access_token, refresh: t.refresh_token, id: t.id_token, exp: Date.now() + (t.expires_in - 10) * 1000 }));
}
async function finishLogin() {
  const q = new URLSearchParams(location.search);
  if (!q.get('code')) return;
  const saved = JSON.parse(S.getItem('pkce') || '{}');
  S.removeItem('pkce');
  history.replaceState(null, '', REDIRECT);
  if (!saved.state || saved.state !== q.get('state')) throw new Error('login state mismatch');
  await tokenRequest({ grant_type: 'authorization_code', code: q.get('code'), redirect_uri: REDIRECT, code_verifier: saved.verifier });
}
async function accessToken() {
  let t = JSON.parse(S.getItem('tok') || 'null');
  if (!t) return null;
  if (Date.now() >= t.exp && t.refresh) {
    try { await tokenRequest({ grant_type: 'refresh_token', refresh_token: t.refresh }); t = JSON.parse(S.getItem('tok')); }
    catch { S.removeItem('tok'); return null; }
  }
  return t.access;
}
function logout() {
  const t = JSON.parse(S.getItem('tok') || '{}');
  S.removeItem('tok');
  const p = { client_id: CLIENT_ID, post_logout_redirect_uri: REDIRECT };
  if (t.id) p.id_token_hint = t.id;
  location.href = OIDC + '/logout?' + new URLSearchParams(p);
}
async function api(path, opts = {}) {
  const tok = await accessToken();
  if (!tok) { showLogin(); throw new Error('signed out'); }

const PLATFORM_LABEL = { linux: 'Linux', macos: 'macOS', windows: 'Windows', generic: 'Generic (HTTP)' };

const SCRIPT_UNIX = String.raw`#!/usr/bin/env bash
# ASIX forwarder (@LABEL@). Ships new log lines to ASIX over HTTPS.
#   Run:     chmod +x asix-forwarder.sh && sudo ./asix-forwarder.sh
#   Keep it running with systemd/launchd, or: nohup ./asix-forwarder.sh &
# The self-signed certificate is accepted with -k. Once you trust it, replace -k with
#   --cacert /path/to/asix-nginx-tls.crt

ASIX_KEY="@KEY@"
COLLECTOR="$(hostname -s)"
PLATFORM="@PLATFORM@"
@SOURCE@
BUF="$(mktemp)"
trap 'rm -f "$BUF"' EXIT
send() {
  [ -s "$BUF" ] || return 0
  if curl -fsS -k -m 20 -X POST "$ASIX_URL" \
       -H "Authorization: Bearer $ASIX_KEY" -H "Content-Type: text/plain" \
       -H "X-ASIX-Collector: $COLLECTOR" -H "X-ASIX-Platform: $PLATFORM" \
       -H "X-ASIX-Os: $(uname -sr)" -H "X-ASIX-Version: 1.0" \
       -H "X-ASIX-Source-Type: syslog" --data-binary @"$BUF" >/dev/null; then
    : > "$BUF"
  elif [ "$(wc -c < "$BUF")" -gt 5000000 ]; then
    : > "$BUF"   # endpoint unreachable for too long: drop the backlog instead of filling the disk
  fi

$SOURCE_CMD 2>/dev/null | while true; do
  if IFS= read -r -t 5 line; then
    [ -n "$line" ] && { printf '%s\n' "$line" >> "$BUF"; n=$((n+1)); }
  else
    [ $? -gt 128 ] || break          # >128 means read timed out; anything else means the stream ended
  fi

    const drawFieldList = () => box.replaceChildren(...list.filter((f) => f[0].toLowerCase().includes(XS.fq.toLowerCase())).flatMap(([name]) => {
      const out = [el('div', { className: 'xf' + (XS.open === name ? ' on' : ''), onclick: () => { XS.open = XS.open === name ? '' : name; drawFieldList(); } }, el('span', { className: 'ft', textContent: 'T' }), el('span', { textContent: name }))];

      } else if (XS.open === name) out.push(el('div', { className: 'xv' }, el('div', { className: 'xvr', onclick: () => append('| fields ' + name), textContent: 'Add to a fields stage' })));
      return out;
    }));
    drawFieldList();
    return el('div', { className: 'xfp' }, el('div', { className: 'mute', style: 'font-size:11px;letter-spacing:.8px;margin-bottom:8px', textContent: 'FIELDS' }), q, box);
  }
  function resultsView() {
    if (XS.err) return el('div', { className: 'card' }, el('div', { className: 'mute', textContent: 'Fix the query and run it again.' }));

    const disp = el('details', { className: 'xdisp' }, el('summary', { className: 'btn', textContent: 'Display' }),
      el('div', { className: 'xmenu' }, r.columns.filter((c) => c !== '_id').map((c) => el('label', { className: 'xchk' }, el('input', { type: 'checkbox', checked: !XS.hidden.has(c), onchange: (e) => { e.target.checked ? XS.hidden.delete(c) : XS.hidden.add(c); draw(); } }), c))));
    const dl = el('button', { className: 'btn', textContent: 'Download CSV', onclick: () => {
      const csv = [cols.map(csvCell).join(',')].concat(r.rows.map((x) => cols.map((c) => csvCell(x[c])).join(','))).join('\r\n');
      const a = el('a', { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv' })), download: 'asix-query-results.csv' }); document.body.append(a); a.click(); a.remove();
    } });
    const t = el('table'); t.append(el('thead', {}, el('tr', {}, cols.map((c) => el('th', { textContent: c })))));
    const tb = el('tbody');
    r.rows.slice(0, SHOW).forEach((row) => {
      const det = el('tr', { className: 'hidden' }, el('td', { colSpan: cols.length }, el('pre', { textContent: JSON.stringify(row, null, 2) })));
      tb.append(el('tr', { className: 'row', onclick: () => det.classList.toggle('hidden') }, cols.map((c) => el('td', { className: c === '_raw' || c === 'message' ? 'msg' : '', textContent: row[c] === null || row[c] === undefined ? '' : row[c] }))), det);
    });
    t.append(tb);
    return el('div', {}, el('div', { className: 'xbar' }, el('b', { textContent: r.count.toLocaleString() + ' results' + (r.truncated ? '+' : '') }), el('span', { className: 'mute', textContent: r.took_ms + ' ms' }),
      r.truncated ? pill('truncated by limit', 'off') : '', r.count > SHOW ? el('span', { className: 'mute', textContent: 'showing first ' + SHOW + ' - download for all' }) : '', el('span', { style: 'flex:1' }), disp, dl),
      el('div', { className: 'xres' }, fieldsPanel(), el('div', { className: 'xtbl' }, r.count ? t : el('div', { className: 'mute', style: 'padding:14px', textContent: 'No events matched in this time range.' }))));
  }
  function helperView() {
    return el('div', { className: 'grid' }, XHELP.map(([t, d, ex]) => el('div', { className: 'card' }, el('h3', { textContent: t }), el('div', { className: 'mute', style: 'margin-bottom:8px', textContent: d }),
      ex.map((x) => el('div', { className: 'xex', title: 'Click to add to the query', onclick: () => (x.startsWith('|') || x.startsWith('dataset') ? (x.startsWith('dataset') ? setQ(x) : append(x)) : append(x)), textContent: x })))));
  }
  function libraryView() {

      el('button', { className: 'btn', textContent: 'Load', onclick: () => { setQ(x.q); XS.tab = 'results'; draw(); } }), ' ', el('button', { className: 'btn pri', textContent: 'Run', onclick: () => { setQ(x.q); runQ(); } }),

  }
  function schemaView() {

      { h: '', f: (d) => el('button', { className: 'btn', textContent: 'Query', onclick: () => { setQ('dataset = ' + d.name + '\n| limit 100'); XS.tab = 'results'; draw(); } }) }], f.datasets, 'No events yet.')),

  }
  function draw() {

    body.replaceChildren(XS.tab === 'results' ? resultsView() : XS.tab === 'helper' ? helperView() : XS.tab === 'library' ? libraryView() : schemaView());

  wrap.append(el('div', { style: 'display:flex;align-items:center;justify-content:space-between;gap:12px' }, el('h2', { textContent: 'XQL Query' }), range),
    el('p', { className: 'desc', textContent: 'Query stored events with an XQL-style pipeline: dataset, filter, fields, sort, limit, comp.' }),
    el('div', { className: 'xed' }, gut, el('div', { className: 'xwrap' }, hl, ta)), errBox,
    el('div', { className: 'xbtns' }, el('button', { className: 'btn', textContent: 'Clear', onclick: () => { setQ(''); XS.res = null; XS.err = ''; errBox.textContent = ''; draw(); } }), el('button', { className: 'btn', textContent: 'Save as', onclick: saveAs }), runBtn),
    tabs, body);
  sync(); draw();
  if (!XS.fields) {
    api('/v1/search/fields').then((f) => {
      XS.fields = f;
      if (!XS.booted && !ta.value.trim() && f.datasets && f.datasets.length) { setQ('dataset = ' + f.datasets[0].name + '\n| limit 100'); XS.booted = true; runQ(); } else draw();
    }).catch(() => { XS.fields = { fields: [], datasets: [] }; draw(); });
  }
  return wrap;
}

// ---- boot ---------------------------------------------------------------------------
$('signin').onclick = login;
window.addEventListener('hashchange', () => { if (!$('app').classList.contains('hidden')) route(); });
(async () => {
  try {
    if (!crypto.subtle) throw new Error('This page needs HTTPS (secure context). Use the https:// address.');
    await finishLogin();
    const tok = await accessToken();
    if (!tok) return showLogin();
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    username = jwtClaims(tok).preferred_username || '';
    setTheme(theme());
    api('/v1/auth/me').then((m) => { tenantName = m.tenant_name; }).catch(() => { tenantName = 'no tenant'; }).finally(route);
  } catch (e) { showLogin(e.message); }
})();
function showLogin(msg) { $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('loginerr').textContent = msg || ''; }
</script>
