# ASIX — forward this VM's own auth events to the local syslog collector.
# Install as /etc/rsyslog.d/60-asix-forward.conf, then: systemctl restart rsyslog
#
# Starting with auth/authpriv only (SSH logins, sudo) — this is the
# highest-signal, lowest-volume facility on a single VM, and matches
# the "prove ingestion with real security-relevant events" goal before
# widening to all facilities or adding a second source.

# TCP forward (recommended — has framing/delivery guarantees UDP doesn't).
# The collector's TCP framing is newline-delimited, which is what
# omfwd sends by default.
auth,authpriv.*    @@127.0.0.1:30514

# If you'd rather use UDP instead, comment the line above and use:
# auth,authpriv.*  @127.0.0.1:30514

# To widen later to everything (not just auth), replace the selector
# above with:  *.*    @@127.0.0.1:30514
