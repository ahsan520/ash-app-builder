# Kong Gateway — Level 2 Approved (user instruction: Kong gateway)
description: "Kong API Gateway — TLS termination + auth forwarding + rate limits + tenant extraction"
image: "kong:3.6"
environment:
  KONG_DATABASE: "postgres"
  KONG_PROXY_ACCESS_LOG: "/dev/stdout"
  KONG_ADMIN_ACCESS_LOG: "/dev/stdout"
  KONG_PROXY_ERROR_LOG: "/dev/stdout"
configuration:
  rate_limits:
    auth_endpoints: "5/min/IP"
    read_endpoints: "100/min/user"
    write_endpoints: "20/min/user"
  tls_termination: true
  auth_forwarding: true  # Keycloak JWT validation via gateway middleware
rollback_plan: "Kong config backup; restore previous gateway config"
audit: "deployment/gateway/level-2/user-approval"
