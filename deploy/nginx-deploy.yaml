apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-control
  namespace: asix-platform
  labels:
    app: nginx-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-control
  template:
    metadata:
      labels:
        app: nginx-control
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-control-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-control
  namespace: asix-platform
spec:
  selector:
    app: nginx-control
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
  type: ClusterIP
