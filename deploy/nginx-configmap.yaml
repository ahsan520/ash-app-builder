apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-control-config
  namespace: asix-platform
data:
  default.conf: |
    upstream keycloak {
      server keycloak.asix-platform.svc.cluster.local:8080;
    }
    server {
      listen 80;
      location / {
        proxy_pass http://asix-api.asix-platform.svc.cluster.local:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
      location /auth/ {
        proxy_pass http://keycloak.asix-platform.svc.cluster.local:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
      location /search/ {
        proxy_pass http://asix-api.asix-platform.svc.cluster.local:3000/search/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
    }
