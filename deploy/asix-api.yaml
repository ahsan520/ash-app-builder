apiVersion: apps/v1
kind: Deployment
metadata:
  name: asix-api
  namespace: asix-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asix-api
  template:
    metadata:
      labels:
        app: asix-api
    spec:
      containers:
        - name: asix-api
          image: localhost:32000/asix-api:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: "postgresql"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "asix_platform"
            - name: DB_USER
              value: "asix_admin"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /v1/health/status
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: asix-api
  namespace: asix-platform
spec:
  selector:
    app: asix-api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP
